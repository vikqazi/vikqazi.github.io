<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flightline is now Fowl Atlas</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://fowlatlas.com/">
<script>
  // Flightline is now Fowl Atlas, at fowlatlas.com (2026-11-04). Old links from vikqazi.github.io/flightline (and the
  // older /granite-flyway) go straight there: keep the rest of the path, the query and the #map view of the old link.
  var rest = location.pathname.replace(/^\/(flightline|granite-flyway)(\/|$)/, "").replace(/^\//, "");
  location.replace("https://fowlatlas.com/" + rest + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=https://fowlatlas.com/">

</head>
